services:
  maxubot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      BOT_API_URL: http://telegram-bot-api:8081
      REDIS_URL: redis://redis:6379/0
      DOWNLOAD_DIR: /dev/shm/maxubot
    depends_on:
      - telegram-bot-api
      - redis
    # Розкоментуй, якщо використовуєш cookies для Instagram:
    # volumes:
    #   - ./cookies.txt:/app/cookies.txt:ro
    # Тимчасові файли в RAM — нуль дискового I/O.
    # Потрібно ~2× розміру найбільшого відео (відео+аудіо до злиття).
    tmpfs:
      - /dev/shm:size=4g

  # Самохостнутий Bot API сервер: знімає ліміт 50 МБ → до 2 ГБ.
  # Потрібні API_ID/API_HASH з https://my.telegram.org (розділ API development tools).
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${API_ID}
      TELEGRAM_API_HASH: ${API_HASH}
      TELEGRAM_LOCAL: "1"
    volumes:
      - bot-api-data:/var/lib/telegram-bot-api

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 300 1 --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data

volumes:
  bot-api-data:
  redis-data:
